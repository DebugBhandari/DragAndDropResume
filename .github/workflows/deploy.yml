name: Deploy to VPS

on:
  push:
  workflow_dispatch:

env:
  APP_DIR: /var/www/resume-debugbhandari-link
  SERVICE_NAME: resume-debugbhandari
  DOMAIN: resume.debugbhandari.link
  APP_PORT: 3001

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Package build output
        run: |
          set -euo pipefail
          tar -czf release.tgz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ]; then
            echo "VPS_HOST is empty. Set secrets.VPS_HOST (or optional secrets.VPS_HOST_IP)."
            exit 1
          fi

          # If host is a DNS name, give resolver a few chances before failing.
          if [[ ! "$VPS_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            for i in 1 2 3 4 5; do
              if getent ahosts "$VPS_HOST" >/dev/null 2>&1; then
                break
              fi

              if [ "$i" -eq 5 ]; then
                echo "Could not resolve VPS_HOST=$VPS_HOST from GitHub runner."
                echo "Set secrets.VPS_HOST to a public DNS name or set secrets.VPS_HOST_IP to server public IP."
                exit 1
              fi

              echo "DNS resolution failed for $VPS_HOST (attempt $i/5). Retrying..."
              sleep 3
            done
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3 4 5; do
            if ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "ssh-keyscan failed for $VPS_HOST:${VPS_PORT:-22} after 5 attempts."
              exit 1
            fi

            echo "ssh-keyscan failed (attempt $i/5). Retrying..."
            sleep 3
          done

      - name: Upload build artifact
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          scp -P "${VPS_PORT:-22}" release.tgz "$VPS_USER@$VPS_HOST:/tmp/${SERVICE_NAME}-release.tgz"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          FEEDBACK_SMTP_HOST: ${{ secrets.FEEDBACK_SMTP_HOST }}
          FEEDBACK_SMTP_PORT: ${{ secrets.FEEDBACK_SMTP_PORT }}
          FEEDBACK_SMTP_USER: ${{ secrets.FEEDBACK_SMTP_USER }}
          FEEDBACK_SMTP_PASS: ${{ secrets.FEEDBACK_SMTP_PASS }}
          FEEDBACK_FROM: ${{ secrets.FEEDBACK_FROM }}
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' DOMAIN='$DOMAIN' APP_PORT='$APP_PORT' FEEDBACK_SMTP_HOST='$FEEDBACK_SMTP_HOST' FEEDBACK_SMTP_PORT='$FEEDBACK_SMTP_PORT' FEEDBACK_SMTP_USER='$FEEDBACK_SMTP_USER' FEEDBACK_SMTP_PASS='$FEEDBACK_SMTP_PASS' FEEDBACK_FROM='$FEEDBACK_FROM' bash -s" <<'EOF'
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          if ! command -v node >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
            chmod a+r /etc/apt/keyrings/nodesource.gpg
            echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update
            apt-get install -y nodejs
          fi

          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update
            apt-get install -y nginx
          fi

          mkdir -p "$APP_DIR"
          rm -rf "$APP_DIR/.next" "$APP_DIR/public"
          tar -xzf "/tmp/${SERVICE_NAME}-release.tgz" -C "$APP_DIR"
          rm -f "/tmp/${SERVICE_NAME}-release.tgz"

          cd "$APP_DIR"
          npm ci --omit=dev

          cat >/etc/systemd/system/${SERVICE_NAME}.service <<UNIT
          [Unit]
          Description=Next.js Resume App (${DOMAIN})
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=${APP_DIR}
          ExecStart=/usr/bin/node node_modules/next/dist/bin/next start -H 127.0.0.1 -p ${APP_PORT}
          Restart=always
          RestartSec=5
          Environment=NODE_ENV=production
          Environment=FEEDBACK_SMTP_HOST=${FEEDBACK_SMTP_HOST}
          Environment=FEEDBACK_SMTP_PORT=${FEEDBACK_SMTP_PORT}
          Environment=FEEDBACK_SMTP_USER=${FEEDBACK_SMTP_USER}
          Environment=FEEDBACK_SMTP_PASS=${FEEDBACK_SMTP_PASS}
          Environment=FEEDBACK_FROM=${FEEDBACK_FROM}

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable ${SERVICE_NAME}
          systemctl restart ${SERVICE_NAME}

          CERT_DIR="/etc/letsencrypt/live/${DOMAIN}"
          if [ -f "${CERT_DIR}/fullchain.pem" ] && [ -f "${CERT_DIR}/privkey.pem" ]; then
            cat >/etc/nginx/sites-available/${DOMAIN}.conf <<NGINX
          server {
            listen 80;
            listen [::]:80;
            server_name ${DOMAIN};
            return 301 https://\$host\$request_uri;
          }

          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name ${DOMAIN};

            ssl_certificate ${CERT_DIR}/fullchain.pem;
            ssl_certificate_key ${CERT_DIR}/privkey.pem;

            location / {
              proxy_pass http://127.0.0.1:${APP_PORT};
              proxy_http_version 1.1;
              proxy_set_header Upgrade \$http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
              proxy_cache_bypass \$http_upgrade;
            }
          }
          NGINX
          else
            cat >/etc/nginx/sites-available/${DOMAIN}.conf <<NGINX
          server {
            listen 80;
            listen [::]:80;
            server_name ${DOMAIN};

            location / {
              proxy_pass http://127.0.0.1:${APP_PORT};
              proxy_http_version 1.1;
              proxy_set_header Upgrade \$http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
              proxy_cache_bypass \$http_upgrade;
            }
          }
          NGINX
            echo "No TLS certificate found at ${CERT_DIR}. Serving HTTP only for ${DOMAIN}."
          fi

          ln -sfn /etc/nginx/sites-available/${DOMAIN}.conf /etc/nginx/sites-enabled/${DOMAIN}.conf
          nginx -t
          systemctl reload nginx

          systemctl is-active --quiet ${SERVICE_NAME}
          EOF
